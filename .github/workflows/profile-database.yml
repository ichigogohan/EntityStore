name: Profile database
on:
  pull_request:
    branches: [main, codex/redis-cache-resilience]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: profile
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: profile_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U profile -d profile_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql://profile:integration-only@localhost:5432/profile_test
      REDIS_URL: redis://localhost:6379
    defaults:
      run:
        working-directory: services/profile-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/profile-server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
